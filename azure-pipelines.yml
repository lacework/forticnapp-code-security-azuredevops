# CI pipeline for building and testing the Lacework Code Security Azure DevOps integration

trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - master

variables:
  - group: lacework-credentials

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Test
    jobs:
      - job: UnitTests
        displayName: 'Unit Tests'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Setup Node.js'

          - script: |
              cd scripts
              npm install
              npx tsc
            displayName: 'TypeScript compilation'

          - script: |
              python3 test/test_sanitize_markdown.py -v
            displayName: 'Markdown sanitizer tests'

      - job: IntegrationTest
        displayName: 'Integration Test'
        condition: and(succeeded(), ne(variables['LW_ACCOUNT'], ''))
        steps:
          - script: |
              docker build -t test/code-security-azure:test .
            displayName: 'Docker build'

          - script: |
              set -e
              cd test/sample-repo
              git init
              git config user.email "ci@test.com"
              git config user.name "CI"
              git add .
              git commit -m "test"
              cd ../..
              docker run \
                -e LW_ACCOUNT="$(LW_ACCOUNT)" \
                -e LW_API_KEY="$(LW_API_KEY)" \
                -e LW_API_SECRET="$(LW_API_SECRET)" \
                -e BUILD_REASON="IndividualCI" \
                -e BUILD_SOURCEBRANCHNAME="main" \
                -v $(Build.SourcesDirectory)/test/sample-repo:/app/src \
                -e WORKSPACE=src \
                test/code-security-azure:test
            displayName: 'Push scan integration test'
            env:
              LW_API_KEY: $(LW_API_KEY)
              LW_API_SECRET: $(LW_API_SECRET)

  - stage: PushBranchImage
    dependsOn: Test
    condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: DockerBuildBranch
        displayName: 'Build and Push Branch Image'
        steps:
          - task: Docker@2
            inputs:
              command: login
              containerRegistry: 'dockerhub'
            displayName: 'Docker Hub login'

          - task: Docker@2
            inputs:
              command: buildAndPush
              repository: 'lacework/code-security-azure'
              dockerfile: 'Dockerfile'
              tags: |
                $(Build.SourceBranchName)
            displayName: 'Build and push branch-tagged image'

  - stage: BuildAndPush
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - job: DockerBuild
        displayName: 'Build and Push Docker Image'
        steps:
          - task: Docker@2
            inputs:
              command: login
              containerRegistry: 'dockerhub'
            displayName: 'Docker Hub login'

          - task: Docker@2
            inputs:
              command: buildAndPush
              repository: 'lacework/code-security-azure'
              dockerfile: 'Dockerfile'
              tags: |
                latest
                $(Build.BuildNumber)
            displayName: 'Build and push image'
